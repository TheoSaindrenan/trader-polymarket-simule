name: Trader simulé

on:
  schedule:
    - cron: "*/10 * * * *"   # toutes les 10 min (GitHub peut retarder de quelques minutes)
  workflow_dispatch:          # bouton « Run workflow » pour lancer un cycle à la main

permissions:
  contents: write   # enregistrer journal et état dans le dépôt
  issues: write     # ouvrir une issue d'alerte à l'arrêt
  actions: write    # désactiver le workflow à l'arrêt

concurrency:
  group: trader-simule
  cancel-in-progress: false   # jamais deux cycles en même temps

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Vérifier la clé Anthropic
        id: cle
        env:
          CLE: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CLE" ]; then
            echo "::warning::Secret ANTHROPIC_API_KEY absent : cycle sauté. Ajoute-le dans Settings → Secrets and variables → Actions."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.cle.outputs.ok == '1'

      - uses: actions/setup-python@v6
        if: steps.cle.outputs.ok == '1'
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
        if: steps.cle.outputs.ok == '1'

      - name: Cycle de simulation
        id: cycle
        if: steps.cle.outputs.ok == '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          MODELE_CLAUDE: ${{ vars.MODELE_CLAUDE }}
          ANALYSES_MAX: ${{ vars.ANALYSES_MAX }}
          X_BUDGET_JOUR: ${{ vars.X_BUDGET_JOUR }}
          X_POSTS: ${{ vars.X_POSTS }}
        run: |
          deja_arrete=$([ -f ALERTE_ARRET.txt ] && echo 1 || echo 0)
          python3 trader_simule.py --une-fois
          if [ "$deja_arrete" = 0 ] && [ -f ALERTE_ARRET.txt ]; then
            echo "arret=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Enregistrer journal et état
        if: always() && steps.cle.outputs.ok == '1'
        run: |
          git config user.name "trader-simule"
          git config user.email "trader-simule@users.noreply.github.com"
          for f in paris_script.txt etat_script.json ALERTE_ARRET.txt; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && exit 0
          git commit -m "Cycle $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1

      - name: Alerte d'arrêt
        if: steps.cycle.outputs.arret == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Trader simulé arrêté" --body-file ALERTE_ARRET.txt
          gh workflow disable "Trader simulé"
          echo "::error::Simulation arrêtée — voir paris_script.txt"
          exit 1
